# MMSS64 Nginx site — public entry point on the Azure VPS, after cutover.
#
#   Internet  ->  Nginx :80/:443  ->  SvelteKit on 127.0.0.1:3002
#                                       -> Rust API on 127.0.0.1:3001
#
# Replaces infra/nginx/mmss64.conf, which proxied to Express on :3000. That file
# is kept unchanged as the rollback configuration; see FINAL_MIGRATION.md.
#
# The browser talks to exactly one origin, so there is nothing to route for
# `/api`: the frontend's own `src/routes/api/[...path]` proxy forwards to the
# backend server-side, and the cookie stays first-party. A `location /api` block
# here would be dead weight and a chance to get it wrong.
#
# Install:
#   sudo cp infra/nginx/mmss64-sveltekit.conf /etc/nginx/sites-available/mmss64.conf
#   sudo ln -s /etc/nginx/sites-available/mmss64.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # No multipart route exists (R2 stores attachment metadata only), so the
    # default limit is plenty. Raised only if file uploads ever return.
    client_max_body_size 1m;

    # Hashed build assets never change; the rest must not be cached or a deploy
    # leaves students on the old JavaScript.
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # adapter-node reads the protocol from this header when PROTOCOL_HEADER
        # is set on the service. It matters: the frontend decides whether to mark
        # the session cookie `Secure` from the request's scheme, and SvelteKit
        # compares its idea of the origin against the browser's `Origin` header
        # for every form action.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;

        # No EduSecure scraping and no AI formatting left in the request path, so
        # nothing legitimately takes a minute. Long enough for a slow login.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# Once TLS is terminated here (or by a load balancer in front), serve 443 with the
# same `location` blocks and redirect 80 to it. `ORIGIN` on the frontend service
# must then read `https://<public-host>` — the frontend does not infer it.