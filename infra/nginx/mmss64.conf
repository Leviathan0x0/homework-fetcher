# MMSS64 Nginx site — public entry point on the Azure VPS.
#
#   Internet  ->  Nginx :80  ->  Express on 127.0.0.1:3000
#
# Vercel's external rewrite (mmss64.vercel.app /api/*) lands here too; the
# browser never talks to this IP directly. When the school domain arrives,
# point it at this server and serve dist/ statically or keep proxying — the
# Express app already serves the built frontend.
#
# Install:
#   sudo cp infra/nginx/mmss64.conf /etc/nginx/sites-available/mmss64.conf
#   sudo ln -s /etc/nginx/sites-available/mmss64.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # The app accepts 10 MB uploads on a Node host (see server/limits.js);
    # Nginx's 1 MB default would silently break every photo upload.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Pass Vercel's X-Forwarded-For through unchanged (it carries the real
        # client IP). Appending $remote_addr here would make Express
        # (trust proxy = 1) see the Vercel edge IP and collapse every
        # anonymous user into one rate-limit bucket.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # Vercel terminates TLS; the browser protocol must survive the hop so
        # Secure cookies keep working. Direct http:// visits simply have no
        # value here and Express falls back to the socket scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        # EduSecure scrapes and AI-assisted refreshes can exceed 60s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
