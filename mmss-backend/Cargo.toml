[package]
name = "mmss-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
# Roster parsing. A vetted RFC 4180 reader rather than a hand-rolled split: a quoting bug
# in the identity import path would mis-assign a student to the wrong class, and a
# misplaced quote silently swallows the rest of the row. No transitive runtime cost that
# matters -- `csv` is pure Rust with no build script.
csv = "1"
dotenvy = "0.15"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
