<!doctype html>
<html lang="en" class="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#08080a" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!--
			Apply the stored theme before first paint.

			A component cannot do this early enough: the document would paint light, then the
			component would add `.dark`, and a student who chose dark mode gets a white flash
			on every single navigation. The old app had exactly that bug.

			The nonce is what lets this stay an inline script under a Content-Security-Policy
			that does not need `unsafe-inline` for scripts. See `kit.csp` in `vite.config.ts`.
		-->
		<script nonce="%sveltekit.nonce%">
			try {
				var stored = localStorage.getItem('mmss-theme');
				var dark =
					stored === 'dark' ||
					(!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.classList.toggle('light', !dark);
			} catch (e) {
				/* Private mode, storage disabled: light is a fine default. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
